services:
  router-web:
    build: .
    container_name: router-web
    restart: unless-stopped
    env_file:
      - router.env
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
